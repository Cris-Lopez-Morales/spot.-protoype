<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbfaf7">
  <meta name="description" content="Spot — a local, interactive prototype for exploring venue activity. Lincoln-region map with fictional venues, 5,000 demo accounts and 60 friends.">
  <title>spot — Your usuals, and somewhere new.</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='19' fill='%23254e41'/%3E%3Cpath d='M44 28c0 10-12 21-12 21S20 38 20 28a12 12 0 1 1 24 0Z' fill='%23e7efda'/%3E%3Ccircle cx='32' cy='28' r='4' fill='%23254e41'/%3E%3C/svg%3E">
  <meta name="color-scheme" content="light dark">
  <script>(()=>{let mode='system';try{const s=localStorage.getItem('spot.appearance.v1');if(['light','dark','system'].includes(s))mode=s;}catch{}const dark=mode==='dark'||mode==='system'&&matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.dataset.theme=dark?'dark':'light';document.documentElement.dataset.appearance=mode;document.querySelector('meta[name="theme-color"]').content=dark?'#141d18':'#fbfaf7';})();</script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app-shell">
    <aside class="desktop-nav" aria-label="Main navigation">
      <a href="#explore" class="brand-mark" aria-label="Spot home" data-screen="explore"><span class="logo-glyph"></span></a>
      <nav id="desktopNavigation"></nav>
      <button class="rail-bottom" data-action="about" aria-label="About this prototype" title="About this prototype"></button>
      <div class="rail-avatar" aria-label="Your demo profile">Y</div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <a class="wordmark" href="#explore" data-screen="explore">spot<span class="wordmark-dot">.</span></a>
        <span class="topbar-divider"></span>
        <span class="topbar-tagline">A little closer. A little further.</span>
        <div class="topbar-actions">
          <button class="demo-badge" data-action="about"><span class="demo-dot"></span> 5,000 <span>demo users</span></button>
          <div id="appearanceControl" class="appearance"></div>
          <button class="privacy-status" id="privacyStatus" data-screen="privacy"></button>
        </div>
      </header>
      <main id="main" tabindex="-1"></main>
    </div>
    <nav class="mobile-nav" id="mobileNavigation" aria-label="Main navigation"></nav>
  </div>
  <div id="detailHost"></div>
  <div id="modalHost"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript><div class="noscript">This interactive prototype needs JavaScript. No location data is collected.</div></noscript>
  <script src="lincoln-data.js"></script>
  <script src="core.js"></script>
  <script src="map-core.js"></script>
  <script src="map-renderer.js"></script>
  <script src="theme.js"></script>
  <script src="app.js"></script>
</body>
</html>
