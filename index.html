<script>
/* Static Pages edition: never install a worker. A prior Atmosphere worker at the
 * same directory can otherwise keep serving an older build on a later visit.
 * This is deliberately path-scoped; other projects on this origin are untouched.
 */
(function () {
  'use strict';
  if (!/^https?:$/.test(location.protocol) || !('serviceWorker' in navigator)) return;
  window.addEventListener('load', async function () {
    try {
      const base = new URL('./', location.href);
      const expected = new URL('sw.js', base).href;
      const registrations = await navigator.serviceWorker.getRegistrations();
      for (const registration of registrations) {
        const workers = [registration.active, registration.waiting, registration.installing];
        if (registration.scope === base.href && workers.some(worker => worker && worker.scriptURL === expected)) {
          await registration.unregister();
        }
      }
    } catch (_) { /* Storage restrictions never prevent the map from starting. */ }
  }, { once: true });
})();
</script>

  function visiblePlaces(){

  function bindPlaceSearch(){
